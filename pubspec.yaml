name: campus_escape
description: "Campus Escape — escape room mobile untuk siswa SMA yang berkunjung ke SoCS Binus Bekasi."
publish_to: 'none'
version: 0.9.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  video_player: ^2.9.2
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  # Mode online (opsional — aktif setelah `flutterfire configure`).
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/gallery/
    - assets/images/logos/
    - assets/images/lecturers/
    - assets/images/prank_bg.png
    - assets/video/
