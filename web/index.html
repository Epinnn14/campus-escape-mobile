<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- viewport-fit=cover: di iPhone (PWA) konten boleh masuk area notch & home
       indicator, dan Flutter membaca safe-area supaya SafeArea di app akurat.
       user-scalable=no: cegah zoom tidak sengaja saat double-tap di mini-game. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Campus Escape — escape room mobile SoCS BINUS @Bekasi. 10 ruangan mini-game disiplin IT.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Campus Escape">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Campus Escape</title>
  <meta name="theme-color" content="#0B1220">
  <link rel="manifest" href="manifest.json">
  <style>
    /* Latar sama dengan app selama loading; tanpa bounce/overscroll di iOS. */
    html, body { margin: 0; padding: 0; background: #0B1220; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; }
    /* Sentuhan di atas elemen <video> diteruskan ke Flutter (tap = pause, double-tap = ±5 dtk). */
    video { pointer-events: none; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
